<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gallery</title>
<style>
  body { font-family: sans-serif; }
  .item { margin-bottom: 50px; border-bottom: 2px solid #ccc; padding-bottom: 20px; }
  img { max-width: 800px; border: 1px solid #000; }
  h2 { color: red; font-size: 24px; }
</style>
</head>
<body>
  <h1>Image Gallery</h1>
  <div id="gallery"></div>
  <script>
    const gallery = document.getElementById('gallery');
    const images = ['demo1.png', 'demo2.png', 'demo3.png', 'demo4.png', 'demo5.png', 'demo6.png', 'demo7.png', 'demo8.png', 'demo9.png', 'demo10.png', 'demo11.png', 'demo12.png', 'demo13.png', 'demo14.png', 'demo15.png', 'demo16.png'];
    images.forEach(img => {
      const div = document.createElement('div');
      div.className = 'item';
      div.innerHTML = `<h2>${img}</h2><img src="/${img}" alt="${img}">`;
      gallery.appendChild(div);
    });
  </script>
</body>
</html>
